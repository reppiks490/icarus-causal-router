name: ICARUS causal-router assurance

on:
  push:
    branches: [main]
    paths:
      - "causal_router/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/assurance.yml"
  pull_request:
    paths:
      - "causal_router/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/assurance.yml"
  merge_group:
  schedule:
    - cron: "5 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: causal-router-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  tests:
    if: github.event_name != 'schedule'
    name: Tests / Python ${{ matrix.python }}
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile source and tests
        run: python -m compileall -q causal_router tests
      - name: Run complete deterministic unit suite
        run: python -m unittest discover -s tests -v

  deterministic-firewall:
    if: github.event_name != 'schedule'
    name: Determinism + research-authority firewall
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Run identical seeded research scenarios twice
        run: |
          rm -rf .ci-router
          mkdir -p .ci-router
          icarus-research demo --output .ci-router/a --steps 240 --seed 17 | tee .ci-router/a.log
          icarus-research demo --output .ci-router/b --steps 240 --seed 17 | tee .ci-router/b.log
          icarus-research verify --policy .ci-router/a/policy.json --db .ci-router/a/research.db | tee .ci-router/verify.log
      - name: Assert deterministic digest and non-execution authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path(".ci-router/a/report.json").read_text(encoding="utf-8"))
          b = json.loads(Path(".ci-router/b/report.json").read_text(encoding="utf-8"))
          assert a["result_digest"] == b["result_digest"], "seeded replay digest changed"
          for label, report in (("a", a), ("b", b)):
              assert report["authority"] == "research_only", label
              assert report["execution_allowed"] is False, label
              assert report["synthetic"] is True, label
              assert report["market_validation"] is False, label
              assert report["profitability_claim"] is False, label
          print("determinism and authority firewall verified")
          PY
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: causal-router-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-router/
          if-no-files-found: ignore
          retention-days: 7

  package:
    if: github.event_name != 'schedule'
    name: Build + install package artifact
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install wheel and smoke CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          icarus-research --help
      - name: Preserve package evidence
        uses: actions/upload-artifact@v4
        with:
          name: causal-router-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  scheduled-drift:
    if: github.event_name == 'schedule'
    name: Daily deterministic drift check
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile and run full unit suite
        run: |
          python -m compileall -q causal_router tests
          python -m unittest discover -s tests -v
      - name: Verify scheduled research-only smoke replay
        run: |
          rm -rf .ci-router
          icarus-research demo --output .ci-router --steps 120 --seed 17
          icarus-research verify --policy .ci-router/policy.json --db .ci-router/research.db
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".ci-router/report.json").read_text(encoding="utf-8"))
          assert report["authority"] == "research_only"
          assert report["execution_allowed"] is False
          assert report["synthetic"] is True
          assert report["market_validation"] is False
          assert report["profitability_claim"] is False
          PY

  assurance:
    if: always() && github.event_name != 'schedule'
    name: Assurance gate + evidence
    needs: [tests, deterministic-firewall, package]
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Emit machine-readable assurance evidence
        env:
          TESTS: ${{ needs.tests.result }}
          FIREWALL: ${{ needs.deterministic-firewall.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {
              "tests": os.environ["TESTS"],
              "deterministic_firewall": os.environ["FIREWALL"],
              "package": os.environ["PACKAGE"],
          }
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "research_only",
              "execution_allowed": False,
              "market_validation": False,
              "profitability_claim": False,
              "gates": gates,
              "result": "success" if all(v == "success" for v in gates.values()) else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(doc, indent=2, sort_keys=True))
          PY
      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-router-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require all change gates
        env:
          TESTS: ${{ needs.tests.result }}
          FIREWALL: ${{ needs.deterministic-firewall.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          printf 'tests=%s\nfirewall=%s\npackage=%s\n' "$TESTS" "$FIREWALL" "$PACKAGE"
          test "$TESTS" = success
          test "$FIREWALL" = success
          test "$PACKAGE" = success

  scheduled-assurance:
    if: always() && github.event_name == 'schedule'
    name: Scheduled assurance gate + evidence
    needs: [scheduled-drift]
    runs-on: ${{ vars.ASSURANCE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Emit scheduled assurance evidence
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: |
          mkdir -p assurance
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          gates = {"scheduled_drift": os.environ["DRIFT"]}
          doc = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "authority": "research_only",
              "execution_allowed": False,
              "market_validation": False,
              "profitability_claim": False,
              "gates": gates,
              "result": "success" if os.environ["DRIFT"] == "success" else "failure",
          }
          with open("assurance/assurance-summary.json", "w", encoding="utf-8") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
      - name: Upload scheduled assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: causal-router-scheduled-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: assurance/assurance-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Require drift check
        env:
          DRIFT: ${{ needs.scheduled-drift.result }}
        run: test "$DRIFT" = success
